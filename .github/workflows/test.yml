name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography kyber-py pytest pytest-asyncio
          pip install qrcode || true
          pip install -e . || echo "pip install -e . failed, using local imports"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          pytest src/reality_vpn/tests/ -v --tb=short
