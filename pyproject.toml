[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-vpn"
version = "2.1.0"
description = "Xray-compatible REALITY VPN server on pure Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ArtProsto", email = "artem122py@users.noreply.github.com"}
]
dependencies = [
    "cryptography>=41.0.0",
    "kyber-py>=1.0.0",
]

[project.optional-dependencies]
qr = ["qrcode>=7.4.0"]

[project.urls]
Homepage = "https://github.com/artem122py/python-reality-vpn"
Repository = "https://github.com/artem122py/python-reality-vpn"

[project.scripts]
reality-vpn = "reality_vpn.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/reality_vpn/tests"]
